<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
</head>
<body>
        {% for post in posts %}
            <a href=""><h1>{{forloop.counter}} - {{ post.title }}</h1></a>
            <p>{{ post.content }}</p>
        {% empty %}
            <p>No posts found</p>
        {% endfor %}
</body>
</html>
